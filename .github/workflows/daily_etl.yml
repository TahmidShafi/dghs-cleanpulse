name: Daily DGHS Surveillance & Climate ETL Pipeline

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 00:00 BDT (Midnight in Dhaka)
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONPATH: backend/src

jobs:
  run-daily-pipeline:
    name: Execute Medallion ETL & Anomaly Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --project backend --extra dev

      - name: Pre-flight Quality Gate
        run: uv run --project backend pytest backend/ -v

      - name: Execute Medallion Pipeline (Bronze -> Silver -> Gold -> Snapshot)
        run: uv run --project backend python -m cleanpulse.cli run-all

      - name: Generate Markdown Anomaly Audit Report
        run: uv run --project backend python -m cleanpulse.cli export-report --output anomaly_report.md

      - name: Upload Anomaly Audit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dghs-anomaly-audit-report
          path: |
            data/silver/audit_anomalies.parquet
            anomaly_report.md

      - name: Auto-Commit & Push Updated Parquet & Snapshot Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/silver/*.parquet data/gold/*.parquet frontend/public/data/fallback_snapshot.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(data): auto-update daily silver, gold, and snapshot artifacts [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No data changes to commit in daily ETL run."
          fi
