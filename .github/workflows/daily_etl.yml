name: Daily DGHS Surveillance & Climate ETL Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONPATH: backend/src

jobs:
  run-daily-pipeline:
    name: Execute Medallion ETL & Anomaly Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --project backend --extra dev --locked

      - name: Pre-flight Quality Gate
        run: uv run --project backend pytest backend/tests -v

      - name: Execute Live Medallion Pipeline (fails loudly if DGHS or Open-Meteo fails)
        run: uv run --project backend python -m cleanpulse.cli run-all

      - name: Verify Live Provenance Before Commit
        run: |
          uv run --project backend python -c "
          import json, pathlib, sys
          sidecars = sorted(pathlib.Path('data/bronze/dghs').rglob('*.json'))
          if not sidecars:
              sys.exit('No DGHS bronze provenance sidecars found')
          latest = json.loads(sidecars[-1].read_text())
          if latest.get('fetch_source') != 'live':
              sys.exit(f'Refusing to commit non-live data: {latest.get(\"fetch_source\")}')
          print('Verified live DGHS provenance:', sidecars[-1])
          "

      - name: Upload Anomaly Audit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dghs-anomaly-audit-report
          path: |
            data/silver/audit_anomalies.parquet
            anomaly_report.md

      - name: Commit and push updated artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bronze/ data/silver/ data/gold/ frontend/public/data/fallback_snapshot.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(data): auto-update daily bronze, silver, and snapshot artifacts [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          else
            echo "No data changes to commit in daily ETL run."
          fi
